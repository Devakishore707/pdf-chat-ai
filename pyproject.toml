
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-chat-ai"
version = "0.1.0"
description = "A cloud-hosted AI application for asking questions about PDF documents."
requires-python = ">=3.10"
dependencies = [
    "streamlit",
    "PyMuPDF",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
